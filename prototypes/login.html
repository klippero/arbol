<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión · Árbol genealógico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Proza+Libre:wght@400;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-body">

<div class="card">
  <div class="logo">
    <img src="../app/assets/images/arbol.jpg" alt="">
    <span class="logo-texto">Árbol<br>genealógico</span>
  </div>

  <h2>Iniciar sesión</h2>

  <form action="/users/sign_in" method="post">

    <div class="field">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="user[email]" autofocus autocomplete="email">
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="user[password]" autocomplete="current-password">
    </div>

    <div class="remember">
      <input type="checkbox" id="remember_me" name="user[remember_me]">
      <label for="remember_me" style="margin:0;">Recordarme</label>
    </div>

    <div class="actions">
      <button type="submit" class="btn">Entrar</button>
    </div>

  </form>

  <div class="enlaces">
    <a href="registro.html">Crear cuenta</a>
    <a href="#">¿Olvidaste tu contraseña?</a>
  </div>
</div>

</body>
</html>
