<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200">
  <defs>
    <clipPath id="soil">
      <path d="M 20 80 A 90 90 0 0 0 200 80 Z"/>
    </clipPath>
  </defs>

  <!-- trunk stub above ground -->
  <line x1="110" y1="18" x2="110" y2="80"
        stroke="#1e3d0f" stroke-width="10" stroke-linecap="round"/>

  <!-- soil semicircle -->
  <path d="M 20 80 A 90 90 0 0 0 200 80 Z" fill="#1e3d0f"/>

  <!-- root network in white, clipped to semicircle -->
  <g clip-path="url(#soil)" fill="none" stroke="white" stroke-linecap="round">

    <!-- main root descending from trunk -->
    <path d="M110 80 C110 94 110 108 110 122" stroke-width="10"/>

    <!-- far-left root -->
    <path d="M110 90 C92 100 68 114 44 132" stroke-width="7.5"/>
    <path d="M44 132 C32 142 26 158 34 170"  stroke-width="5"/>
    <path d="M44 132 C38 146 44 162 56 168"  stroke-width="4"/>

    <!-- left root -->
    <path d="M110 102 C94 114 78 128 62 146"  stroke-width="7"/>
    <path d="M62 146 C54 158 56 172 66 178"   stroke-width="4.5"/>

    <!-- center-left root -->
    <path d="M110 122 C100 136 90 152 82 168" stroke-width="6"/>

    <!-- center-right root -->
    <path d="M110 122 C120 136 130 152 138 168" stroke-width="6"/>

    <!-- right root -->
    <path d="M110 102 C126 114 142 128 158 146" stroke-width="7"/>
    <path d="M158 146 C166 158 164 172 154 178"  stroke-width="4.5"/>

    <!-- far-right root -->
    <path d="M110 90 C128 100 152 114 176 132"  stroke-width="7.5"/>
    <path d="M176 132 C188 142 194 158 186 170" stroke-width="5"/>
    <path d="M176 132 C182 146 176 162 164 168" stroke-width="4"/>

  </g>
</svg>
